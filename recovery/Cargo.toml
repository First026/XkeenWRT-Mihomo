[package]
name = "xkeenwrt-recovery"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.11"
idna = "1.1"
profile-policy = { path = "../crates/profile-policy" }
mihomo-release = { path = "../crates/mihomo-release" }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[features]
default = []
lab-hooks = []
