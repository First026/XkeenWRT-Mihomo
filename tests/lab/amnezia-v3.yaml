proxies:
  - name: v3
    type: wireguard
    ip: 192.0.2.2/32
    ipv6: 2001:db8::2/128
    private-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    udp: true
    # В случае недоступности сети, попробуйте увеличить MTU до 1420 или 1500
    mtu: 1280
    peers:
      - server: 2001:db8::1
        port: 51820
        public-key: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
        allowed-ips:
          - 0.0.0.0/0
          - ::/0
    persistent-keepalive: 25
    amnezia-wg-option:
      version: 3
      jc: 4
      header-protection-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      content-padding-addition: '10'
      rekey-after-time: '120'
      rekey-timeout: '5'
      reject-after-time: '180'
      keepalive-timeout: '10'
      max-handshake-attempts: '18'
      random-trailers: true
      disable-cookies: false
